# Example metadata for Jifu's bilateral Neuropixels sessions (IM-1994, 2026-11-03).
#
# This converts BOTH probes and BOTH recordings into a single NWB file, with the preprocessed
# traces from the optonpx pipeline. See metadata_fully_explained.yaml for what every field means.
#
# Paths below are the real 2026-11-03 locations. For a different session, change the date in
# every path, both Open Ephys folder names, and the processed directory.

institution: University of California, San Francisco
lab: Berke Lab
experimenter:
  - Jifu Tong

experiment_description: Hex maze task with bilateral Neuropixels and optotagging
animal_name: IM-1994
date: 11/03/2026
# NEW FIELD 'maze' AS OF NOVEMBER 2026
# The maze (old_maze or new_maze) sets the size that pixels_per_cm is calculated based on
maze: old_maze
subject:
  subject_id: IM-1994
  species: Rattus norvegicus
  genotype: D1-Cre
  sex: M
  date_of_birth: 2026-06-04
  description: Long Evans Rat

ephys:
  # The two recordings, in the order they were recorded. They are concatenated into one
  # ElectricalSeries so they can be spike sorted together.
  #
  # Each recording gets an NWB epoch tagged "ephys_" + its 'session' label, so this file has
  # "ephys_behavior" and "ephys_optotagging". The behavior conversion separately writes the
  # "00_r1" run epoch for the task itself, which spans the trials rather than the whole recording.
  #
  # The 'session' labels below must be the names the PREPROCESSING pipeline used (the session_id
  # values in session_boundaries.json). That is how each recording is matched to its segment of
  # the preprocessed file.
  openephys_folder_paths:
    - path: 'F:\D1-1-7_IM-1994\ephys\2026-11-03_14-21-59'
      session: "behavior"
    - path: 'F:\D1-1-7_IM-1994\ephys\2026-11-03_16-17-54'
      session: "optotagging"

  # Write the preprocessed traces (laser artifacts and common-mode noise interpolated over, phase
  # shift applied) instead of the raw ones, so a re-sort in Spyglass sees what Kilosort saw.
  # The raw folders above are still required: they are the only source of the ADC (port visits,
  # needed for alignment), the channel map and geometry, the conversion factor, and the per-probe
  # start times. Remove this line to write the raw traces instead.
  processed_ephys_path: 'F:\D1-1-7_IM-1994\ephys\2026-11-03'

  # One entry per probe. Listing a probe is what selects it for conversion.
  # 'stream' is required here because the recording holds two probes.
  #
  # targeted_x is ML: NEGATIVE is the left hemisphere, POSITIVE is the right. Spyglass reads the
  # hemisphere from its sign, so getting it wrong puts the probe in the wrong half of the brain.
  #
  # Each sorting_analyzer_path must match the recording this NWB holds. Since both recordings are
  # concatenated here, that is the 'concat' export, NOT 'nwb_export_behavior' - the conversion
  # fails if the lengths disagree, which is what catches the wrong one. Leave the line out for a
  # probe with no analyzer export yet, and no units are written for it.
  probes:
    - stream: "ProbeA"
      probe_type: "Neuropixels 2.0 (4-shank)"
      electrodes_location: "Dorsal Hippocampus"
      targeted_x: 2.9    # ML in mm (positive = right hemisphere)
      targeted_y: -4.2   # AP in mm
      targeted_z: 5.1    # DV in mm
      sorting_analyzer_path: 'F:\D1-1-7_IM-1994\ephys\2026-11-03\probeA\nwb_export_concat\analyzer.zarr'

    - stream: "ProbeB"
      probe_type: "Neuropixels 2.0 (4-shank)"
      electrodes_location: "Nucleus Accumbens"
      targeted_x: 1.8   # ML in mm (positive = right hemisphere)
      targeted_y: 1.7   # AP in mm
      targeted_z: 7.3   # DV in mm
      sorting_analyzer_path: 'F:\D1-1-7_IM-1994\ephys\2026-11-03\probeB\nwb_export_concat\analyzer.zarr'

behavior:
  arduino_text_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\arduinoraw0.txt'
  arduino_timestamps_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\ArduinoStamps0.csv'
  maze_configuration_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\barriers.txt'

video:
  video_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\Behav_Vid0.avi'
  video_timestamps_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\testvidtimes0.csv'
  dlc_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\Behav_Vid0DLC_Resnet50_jifu_hexmaze_v1Jul13shuffle1_snapshot_best-70.h5'
  hex_centroids_file_path: 'Z:\D1-1-7_IM-1994\behavior\2026-11-03\2026-11-03_hex_coordinates.csv'

surgery:
  Bilateral Neuropixels 2.0 implant. Add the details here.

virus:
  Add virus information here.

notes:
  Add any notes about this session here.

keywords:
  - ephys
  - neuropixels
  - optotagging
  - behavior
  - video
  - hex maze
